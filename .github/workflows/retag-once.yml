name: retag-once
# Temporary diagnostic, removed again right after use.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Probe tag permissions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          R="repos/${{ github.repository }}"
          NEW=$(git rev-parse v0.9.0)
          echo "v0.9.0 is now $NEW"
          echo "== create probe tag via API (on current main)"
          gh api -X POST "$R/git/refs" -f ref=refs/tags/retag-probe -f sha="$(git rev-parse HEAD)" --silent && echo ok || echo FAILED
          echo "== move probe tag to HEAD~3 via API (force)"
          gh api -X PATCH "$R/git/refs/tags/retag-probe" -f sha="$(git rev-parse HEAD~3)" -F force=true --silent && echo ok || echo FAILED
          echo "== delete probe tag via API"
          gh api -X DELETE "$R/git/refs/tags/retag-probe" --silent && echo ok || echo FAILED
          echo "== list existing tag v0.9.0 as the remote sees it"
          gh api "$R/git/refs/tags/v0.9.0" --jq '.object.sha'
          echo "== git push (checkout credentials) of a probe tag"
          git tag retag-probe2 HEAD~3
          git push origin refs/tags/retag-probe2 && echo ok || echo FAILED
          git push origin :refs/tags/retag-probe2 && echo ok || echo FAILED
