name: retag-once
# Temporary, removed again right after use: points the existing version tags at the cleaned-up commits.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
      - name: Move tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          while read -r tag sha; do
            [ -z "$tag" ] && continue
            gh api -X PATCH "repos/${{ github.repository }}/git/refs/tags/$tag" -f sha="$sha" -F force=true --silent
            echo "moved $tag -> $sha"
          done <<'LIST'
